name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: gem install json_schemer
      - name: Corpus identity (validate.rb)
        run: ruby tools/validate.rb
      - name: Corpus schema (validate_schema.rb)
        run: ruby tools/validate_schema.rb
